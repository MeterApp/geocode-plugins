name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Structure, manifests and wording are validated in the source repository
# before each publish; this repository only checks that each client installs
# what was published.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Claude Code accepts the manifests
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
      - name: Codex lists the plugin
        run: |
          npm install --global @openai/codex
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add .
          codex plugin list --available --json | tee /tmp/codex.json
          grep -q 'geocode' /tmp/codex.json
